name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip game files (only if a .zip was uploaded)
        shell: bash
        run: |
          if ls *.zip >/dev/null 2>&1; then
            command -v unzip >/dev/null 2>&1 || (apt-get update && apt-get install -y unzip)
            for z in *.zip; do unzip -o "$z" -x '.github/*'; done
          fi
          ls -la

      - name: Collect 3D models (OBJ + MTL) into models/
        shell: bash
        run: |
          mkdir -p models
          find . \( -path ./models -o -path ./.git -o -path ./.godot \) -prune -o -type f \( -iname '*.obj' -o -iname '*.mtl' \) -print0 | while IFS= read -r -d '' f; do cp -n "$f" models/; done
          find . \( -path ./models -o -path ./.git -o -path ./.godot \) -prune -o -type f \( -iname '*.fbx' -o -iname '*.blend' -o -iname '*.obj' -o -iname '*.mtl' \) -exec rm -f {} +
          echo "models:"; ls models | head -50; ls models | wc -l

      - name: Prepare Godot and Android keystore
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          if [ "$HOME" != "/root" ]; then
            if [ -d /root/.local/share/godot/export_templates/4.2.2.stable ]; then
              cp -r /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/
            fi
          fi
          JAVA_BIN="$(readlink -f "$(command -v javac || command -v java)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          SDK=""
          for c in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/lib/android-sdk /root/android-sdk /opt/android-sdk /usr/local/lib/android/sdk; do
            if [ -n "$c" ] && [ -d "$c" ]; then SDK="$c"; break; fi
          done
          echo "JAVA_HOME_DIR=$JAVA_HOME_DIR"
          echo "ANDROID SDK=$SDK"
          ls "$SDK" || true
          keytool -genkeypair -v -keystore "$PWD/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-4.tres << EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.tres
          echo "--- editor settings ---"
          cat ~/.config/godot/editor_settings-4.tres

      - name: Import project
        shell: bash
        run: godot --headless --editor --quit || true

      - name: Export debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/WildSurvival3D.apk 2>&1 | tee build/export.log
          test -s build/WildSurvival3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WildSurvival3D-debug-apk
          path: build/WildSurvival3D.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/export.log
          if-no-files-found: ignore
